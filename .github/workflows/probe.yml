name: probe
on:
  push:
    branches: [claude/project-thread-ux5zt1]
    paths: [.github/workflows/probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Unity package versions
        run: |
          for p in com.unity.render-pipelines.universal com.unity.shadergraph com.unity.inputsystem com.unity.ugui com.unity.test-framework com.unity.cinemachine com.unity.cloud.gltfast com.unity.nuget.newtonsoft-json com.unity.timeline com.unity.burst com.unity.collections com.unity.mathematics com.unity.ai.navigation com.unity.modules.terrain com.unity.ide.rider; do
            curl -s https://packages.unity.com/$p | python3 -c "
          import json,sys
          d=json.load(sys.stdin)
          vs=d['versions']
          ok=[v for v,m in vs.items() if str(m.get('unity','')).startswith('6000') or v.startswith('17.')]
          print('$p', 'latest', d.get('dist-tags',{}).get('latest'), 'u6:', sorted(ok)[-8:])
          print('   recent:', sorted(vs, key=lambda v: d.get('time',{}).get(v,''))[-6:], {v: vs[v].get('unity') for v in sorted(vs, key=lambda v: d.get('time',{}).get(v,''))[-4:]})
          "
          done
      - name: Poly Haven models
        run: |
          curl -s "https://api.polyhaven.com/assets?t=models" | python3 -c "import json,sys; d=json.load(sys.stdin); print(sorted(d)[400:])"
          curl -s "https://api.polyhaven.com/files/bolt_action_rifle_7_62" | python3 -c "import json,sys; d=json.load(sys.stdin); print(list(d)); print(json.dumps(d.get('gltf',{}))[:1500])"
