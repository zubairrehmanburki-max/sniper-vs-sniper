name: Sketchfab scout

# Lists downloadable CC-BY / CC0 Sketchfab models (soldiers, rifles, props) with thumbnails and
# skeleton details, published to the `screens` branch under sketchfab-scout/ for picking.
on:
  workflow_dispatch:
    inputs:
      set:
        description: Query set (blank = soldiers/rifles/props, graphics = anatomy and scenery)
        type: string
        default: ''
  push:
    branches: [claude/project-thread-ux5zt1]
    paths: [tools/sketchfab/scout.py, .github/workflows/sketchfab-scout.yml]

permissions:
  contents: write

concurrency:
  group: sketchfab-scout
  cancel-in-progress: true

jobs:
  scout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Search Sketchfab
        env:
          SKETCHFAB_API_TOKEN: ${{ secrets.SKETCHFAB_API_TOKEN }}
          SCOUT_SET: ${{ inputs.set }}
        run: |
          if [ -z "$SKETCHFAB_API_TOKEN" ]; then echo "::error::SKETCHFAB_API_TOKEN is not set"; exit 1; fi
          python3 tools/sketchfab/scout.py "$RUNNER_TEMP/scout"
      - name: Publish to the screens branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin screens
          git worktree add -B screens ../screens origin/screens
          rm -rf ../screens/sketchfab-scout && mkdir -p ../screens/sketchfab-scout
          cp -r "$RUNNER_TEMP/scout/report.json" "$RUNNER_TEMP/scout/thumbs" ../screens/sketchfab-scout/
          cd ../screens && git add -A && git commit -qm "Sketchfab scout for $GITHUB_SHA"
          # Screen captures from other branches push here too: rebase onto theirs and retry.
          for i in 1 2 3 4 5; do git push -q origin screens && exit 0; git pull -q --rebase origin screens; done; exit 1
