<div style="width: 932px; height: 430px; position: relative; overflow: hidden; color: #EDEFE8; font-family: 'Barlow', 'Helvetica Neue', sans-serif">

</div>
<div style="position: absolute; left: 604px; top: 368px; display: flex; align-items: baseline; gap: 5px"><span style="font-size: 9px; letter-spacing: 0.18em; color: #A7AD9F">MAG</span><span style="font-family: 'Share Tech Mono', monospace; font-size: 18px; color: #F2B33D" data-bind="mag">12.0×</span></div>

<div style="display: flex; align-items: center; gap: 6px">
<button data-on="elevDown" aria-label="Dial elevation down" style="width: 48px; height: 48px; border: 1px solid rgba(237,239,232,0.3); background: rgba(10,12,11,0.6); display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EDEFE8" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
<div style="flex: 1; height: 48px; background: rgba(10,12,11,0.75); border: 1px solid #F2B33D; display: grid; place-items: center"><span style="font-family: 'Share Tech Mono', monospace; font-size: 20px; color: #F2B33D" data-bind="elev">U 3.0</span></div>
<button data-on="elevUp" aria-label="Dial elevation up" style="width: 48px; height: 48px; border: 1px solid rgba(237,239,232,0.3); background: rgba(10,12,11,0.6); display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EDEFE8" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14M12 5v14"></path></svg></button>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.16em; color: #A7AD9F"><span>WINDAGE</span><span>0.1 mil / click</span></div>
<div style="display: flex; align-items: center; gap: 6px">
<button data-on="windLeft" aria-label="Dial windage left" style="width: 48px; height: 48px; border: 1px solid rgba(237,239,232,0.3); background: rgba(10,12,11,0.6); display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EDEFE8" stroke-width="2.4" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
<div style="flex: 1; height: 48px; background: rgba(10,12,11,0.75); border: 1px solid rgba(237,239,232,0.3); display: grid; place-items: center"><span style="font-family: 'Share Tech Mono', monospace; font-size: 20px" data-bind="windage">R 0.4</span></div>
<button data-on="windRight" aria-label="Dial windage right" style="width: 48px; height: 48px; border: 1px solid rgba(237,239,232,0.3); background: rgba(10,12,11,0.6); display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EDEFE8" stroke-width="2.4" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg></button>
</div>
</div>
<div style="padding: 8px 10px; background: rgba(10,12,11,0.6); display: flex; flex-direction: column; gap: 4px; font-size: 11px">
<div style="display: flex; justify-content: space-between"><span style="color: #A7AD9F">Wind, mid zone</span><span style="font-family: 'Share Tech Mono', monospace" data-bind="windRead">5.6 m/s 3:30</span></div>
<div style="display: flex; justify-content: space-between"><span style="color: #A7AD9F" data-bind="solutionLabel">Solution 640 m</span><span style="font-family: 'Share Tech Mono', monospace" data-bind="solution">U 3.1 · R 0.5</span></div>
</div>
</div>

<div style="position: absolute; left: 700px; top: 26px; width: 40px; height: 300px; display: flex; flex-direction: column; align-items: center; gap: 6px">

<span style="font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #A7AD9F">25×</span>
<div data-hold="zoomDrag" data-bind="zoomTrack" style="position: relative; flex: 1; width: 4px; background: rgba(237,239,232,0.2)"><div data-bind="zoomFill" style="position: absolute; left: 0; bottom: 0; width: 4px; height: 35%; background: #EDEFE8"></div><div data-bind="zoomKnob" style="position: absolute; left: -12px; bottom: calc(35% - 14px); width: 28px; height: 28px; border-radius: 50%; background: #EDEFE8; display: grid; place-items: center; font-family: 'Share Tech Mono', monospace; font-size: 10px; color: #0b0d0c"><span data-bind="zoom">12</span></div></div>
<span style="font-family: 'Share Tech Mono', monospace; font-size: 11px; color: #A7AD9F">5×</span>
<button data-on="zoomOut" aria-label="Zoom out" style="width: 40px; height: 36px; border: 1px solid rgba(237,239,232,0.3); background: rgba(10,12,11,0.6); display: grid; place-items: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#EDEFE8" stroke-width="2.4" aria-hidden="true"><path d="M5 12h14"></path></svg></button>
</div>

<div style="position: absolute; right: 20px; top: 14px; display: flex; gap: 8px">
<button data-on="exit" aria-label="Exit scope" style="width: 44px; height: 44px; border: 1px solid rgba(237,239,232,0.25); background: rgba(10,12,11,0.55); display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EDEFE8" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="position: absolute; right: 20px; bottom: 20px; width: 160px; height: 300px">

<div style="display: flex; justify-content: space-between; font-size: 10px; letter-spacing: 0.16em; color: #A7AD9F"><span>BREATH</span><span style="color: #F2B33D" data-bind="breathText">STEADY 3.4 s</span></div>
<div style="height: 6px; background: rgba(237,239,232,0.16)"><div data-bind="breath" style="width: 68%; height: 6px; background: #F2B33D"></div></div>
</div>

</div>
</div>
