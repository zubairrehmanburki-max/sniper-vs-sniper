<div style="width: 932px; height: 430px; position: relative; overflow: hidden; background: #0b0d0c; color: #EDEFE8; font-family: 'Barlow', 'Helvetica Neue', sans-serif">
<div style="position: absolute; inset: 0; background-image: linear-gradient(rgba(237,239,232,0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(237,239,232,0.06) 1px, transparent 1px); background-size: 31px 31px"></div>

<div data-on="el-card" data-bind="el-card" style="position: absolute; left: 20px; top: 14px; width: 168px; height: 92px; border: 1px dashed rgba(237,239,232,0.6); background: rgba(10,12,11,0.4); display: grid; place-items: center; font-size: 10px; letter-spacing: 0.14em; color: #A7AD9F">RANGE CARD</div>
<div data-on="el-compass" data-bind="el-compass" style="position: absolute; left: 316px; top: 8px; width: 300px; height: 34px; border: 1px dashed rgba(237,239,232,0.6); background: rgba(10,12,11,0.4); display: grid; place-items: center; font-size: 10px; letter-spacing: 0.14em; color: #A7AD9F">COMPASS</div>
<div data-on="el-score" data-bind="el-score" style="position: absolute; left: 390px; top: 48px; width: 152px; height: 40px; border: 1px dashed rgba(237,239,232,0.6); background: rgba(10,12,11,0.4); display: grid; place-items: center; font-size: 10px; letter-spacing: 0.14em; color: #A7AD9F">SCORE + TIMER</div>
<div data-on="el-wind" data-bind="el-wind" style="position: absolute; right: 72px; top: 14px; width: 176px; height: 78px; border: 1px dashed rgba(237,239,232,0.6); background: rgba(10,12,11,0.4); display: grid; place-items: center; font-size: 10px; letter-spacing: 0.14em; color: #A7AD9F">WIND</div>
<div data-on="el-ammo" data-bind="el-ammo" style="position: absolute; left: 20px; bottom: 20px; width: 122px; height: 100px; border: 1px dashed rgba(237,239,232,0.6); background: rgba(10,12,11,0.4); display: grid; place-items: center; font-size: 10px; letter-spacing: 0.14em; color: #A7AD9F">AMMO + TOOLS</div>

<div data-on="el-fire" data-bind="el-fire" style="position: absolute; right: 20px; bottom: 20px; width: 112px; height: 112px; border-radius: 50%; border: 2px solid #F2B33D; background: rgba(229,72,59,0.32); display: grid; place-items: center; box-shadow: 0 0 0 4px rgba(242,179,61,0.25)"><svg width="44" height="44" viewBox="0 0 44 44" fill="none" stroke="#EDEFE8" stroke-width="2.2" aria-hidden="true"><circle cx="22" cy="22" r="14"></circle><path d="M22 2v12M22 30v12M2 22h12M30 22h12"></path></svg></div>
<div data-on="el-scope" data-bind="el-scope" style="position: absolute; right: 144px; bottom: 26px; width: 66px; height: 66px; border-radius: 50%; border: 1px dashed rgba(237,239,232,0.6); background: rgba(10,12,11,0.4); display: grid; place-items: center; font-size: 9px; letter-spacing: 0.1em; color: #A7AD9F">SCOPE</div>
<div data-on="el-breath" data-bind="el-breath" style="position: absolute; right: 36px; bottom: 150px; width: 66px; height: 66px; border-radius: 50%; border: 1px dashed rgba(237,239,232,0.6); background: rgba(10,12,11,0.4); display: grid; place-items: center; font-size: 9px; letter-spacing: 0.1em; color: #A7AD9F">BREATH</div>
<div data-on="el-stance" data-bind="el-stance" style="position: absolute; right: 152px; bottom: 112px; width: 50px; height: 94px; border: 1px dashed rgba(237,239,232,0.6); background: rgba(10,12,11,0.4); display: grid; place-items: center; font-size: 9px; letter-spacing: 0.1em; color: #A7AD9F">STANCE</div>

<div style="position: absolute; left: 50%; top: 110px; transform: translateX(-50%); width: 400px; padding: 12px 14px; box-sizing: border-box; background: rgba(10,12,11,0.92); border: 1px solid rgba(237,239,232,0.2); display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 18px; letter-spacing: 0.12em">CUSTOM HUD</div>
<div style="display: flex; gap: 2px; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 13px; letter-spacing: 0.1em">
<button data-on="layout0" data-bind="layout0" style="min-height: 30px; padding: 0 10px; border: 1px solid #F2B33D; background: rgba(242,179,61,0.18); color: #F2B33D">LAYOUT 1</button>
<button data-on="layout1" data-bind="layout1" style="min-height: 30px; padding: 0 10px; border: 1px solid rgba(237,239,232,0.2); background: none; color: #A7AD9F">2</button>
<button data-on="layout2" data-bind="layout2" style="min-height: 30px; padding: 0 10px; border: 1px solid rgba(237,239,232,0.2); background: none; color: #A7AD9F">3</button>
</div>
</div>
<div style="font-size: 11px; color: #A7AD9F">Selected: <span data-bind="selected" style="color: #F2B33D">FIRE BUTTON</span>. <span data-bind="status">Tap an element, then set its size and opacity.</span></div>
<div style="display: flex; align-items: center; gap: 10px; font-size: 12px"><span style="width: 60px">Size</span><div data-bind="size-track" style="flex: 1; height: 26px; position: relative"><div style="position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: rgba(237,239,232,0.2)"><div data-bind="size-fill" style="width: 70%; height: 4px; background: #F2B33D"></div></div><div data-bind="size-knob" style="position: absolute; left: 70%; top: 4px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: #EDEFE8"></div></div><span data-bind="size-value" style="font-family: 'Share Tech Mono', monospace; width: 40px; text-align: right">140%</span></div>
<div style="display: flex; align-items: center; gap: 10px; font-size: 12px"><span style="width: 60px">Opacity</span><div data-bind="opacity-track" style="flex: 1; height: 26px; position: relative"><div style="position: absolute; left: 0; right: 0; top: 11px; height: 4px; background: rgba(237,239,232,0.2)"><div data-bind="opacity-fill" style="width: 55%; height: 4px; background: #F2B33D"></div></div><div data-bind="opacity-knob" style="position: absolute; left: 55%; top: 4px; width: 18px; height: 18px; margin-left: -9px; border-radius: 50%; background: #EDEFE8"></div></div><span data-bind="opacity-value" style="font-family: 'Share Tech Mono', monospace; width: 40px; text-align: right">55%</span></div>
<div data-on="release" style="display: flex; align-items: center; justify-content: space-between; min-height: 28px; font-size: 12px"><span>Fire on hold (prevents accidental shots)</span><span data-bind="release" style="width: 42px; height: 22px; border-radius: 11px; background: #F2B33D; position: relative"><span data-bind="release-knob" style="position: absolute; right: 2px; top: 2px; width: 18px; height: 18px; border-radius: 50%; background: #14120c"></span></span></div>
<div style="display: flex; gap: 8px">
<button data-on="mirror" data-bind="mirror" style="flex: 1; height: 40px; border: 1px solid rgba(237,239,232,0.3); background: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.14em">MIRROR</button>
<button data-on="reset" style="flex: 1; height: 40px; border: 1px solid rgba(237,239,232,0.3); background: none; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 14px; letter-spacing: 0.14em">RESET</button>
<button data-on="save" data-bind="save" style="flex: 1.3; height: 40px; border: none; background: #F2B33D; color: #14120c; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 15px; letter-spacing: 0.14em">SAVE</button>
</div>
</div>
<button data-on="back" aria-label="Close editor" style="position: absolute; right: 20px; top: 14px; width: 44px; height: 44px; border: 1px solid rgba(237,239,232,0.25); background: rgba(10,12,11,0.55); display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EDEFE8" stroke-width="2.2" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
