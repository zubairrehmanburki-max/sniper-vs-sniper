<div style="width: 932px; height: 430px; position: relative; overflow: hidden; color: #EDEFE8; font-family: 'Barlow', 'Helvetica Neue', sans-serif; text-shadow: 0 1px 3px rgba(0,0,0,0.6)">

<div style="position: absolute; left: 0; right: 0; top: 10px; display: flex; justify-content: center">
<div data-bind="scoreBox" style="height: 38px; padding: 0 16px; border-radius: 19px; background: rgba(10,12,11,0.66); display: flex; align-items: center; gap: 10px; text-shadow: none">
<span data-bind="turn" style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.16em; color: #F2B33D">YOUR SHOT</span>
<span data-bind="timer" style="font-family: 'Share Tech Mono', monospace; font-size: 21px">0:17</span>
<span style="font-size: 13px; color: #A7AD9F">·</span>
<span data-bind="score" style="font-family: 'Share Tech Mono', monospace; font-size: 15px; color: #A7AD9F">1 – 1</span>
</div>
</div>

<button data-on="pause" aria-label="Pause" style="position: absolute; left: 20px; top: 10px; width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(237,239,232,0.3); background: rgba(10,12,11,0.55); display: grid; place-items: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EDEFE8" stroke-width="2.4" aria-hidden="true"><path d="M8 5v14M16 5v14"></path></svg></button>

<div data-bind="windBox" style="position: absolute; right: 24px; top: 12px; display: flex; align-items: center; gap: 8px">
<svg data-bind="windArrow" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#EDEFE8" stroke-width="2.2" aria-hidden="true" style="transform: rotate(70deg)"><path d="M12 20V4M6 10l6-6 6 6"></path></svg>
<div style="display: flex; flex-direction: column; gap: 1px">
<span data-bind="windSpeed" style="font-family: 'Share Tech Mono', monospace; font-size: 21px">5.6 m/s</span>
<span data-bind="windZone" style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.14em; color: #C9CDC2">WIND · MID</span>
</div>
</div>

<div data-bind="marker" style="position: absolute; left: 600px; top: 188px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-family: 'Share Tech Mono', monospace; font-size: 12px; color: #ff8a7e" data-bind="markerRange">640 m</span>
<svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 L15 8 L8 15 L1 8 Z" fill="none" stroke="#E5483B" stroke-width="2"></path></svg>
</div>

<svg data-bind="crosshair" width="24" height="24" viewBox="0 0 40 40" aria-hidden="true" style="position: absolute; left: 454px; top: 203px"><g stroke="#EDEFE8" stroke-width="2" opacity="0.85"><path d="M20 4v10M20 26v10M4 20h10M26 20h10"></path></g><circle cx="20" cy="20" r="2" fill="#EDEFE8"></circle></svg>

<div data-bind="dials" style="position: absolute; left: 301px; bottom: 26px; width: 330px; height: 226px"></div>

<div data-bind="cardElevBox" style="position: absolute; left: 266px; top: 228px; width: 130px; padding: 6px 10px; box-sizing: border-box; background: rgba(10,12,11,0.72); border-left: 3px solid #F2B33D; display: flex; flex-direction: column; gap: 1px; text-shadow: none">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.14em; color: #A7AD9F">ELEVATION</span>
<span data-bind="cardElev" style="font-family: 'Share Tech Mono', monospace; font-size: 20px; color: #F2B33D">U 3.1</span>
<span style="font-size: 12px; color: #C9CDC2">swipe sideways</span>
</div>
<div data-bind="cardFocusBox" style="position: absolute; left: 212px; top: 296px; width: 130px; padding: 6px 10px; box-sizing: border-box; background: rgba(10,12,11,0.72); border-left: 3px solid #F2B33D; display: flex; flex-direction: column; gap: 1px; text-shadow: none">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.14em; color: #A7AD9F">FOCUS</span>
<span data-bind="cardFocus" style="font-family: 'Share Tech Mono', monospace; font-size: 20px; color: #F2B33D">600 m</span>
<span style="font-size: 12px; color: #C9CDC2">swipe up / down</span>
</div>
<div data-bind="cardWindBox" style="position: absolute; left: 590px; top: 296px; width: 130px; padding: 6px 10px; box-sizing: border-box; background: rgba(10,12,11,0.72); border-left: 3px solid #F2B33D; display: flex; flex-direction: column; gap: 1px; text-shadow: none">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.14em; color: #A7AD9F">WINDAGE</span>
<span data-bind="cardWind" style="font-family: 'Share Tech Mono', monospace; font-size: 20px; color: #F2B33D">R 0.5</span>
<span style="font-size: 12px; color: #C9CDC2">swipe up / down</span>
</div>
<div data-bind="cardZoomBox" style="position: absolute; left: 566px; top: 360px; width: 130px; padding: 6px 10px; box-sizing: border-box; background: rgba(10,12,11,0.72); border-left: 3px solid #F2B33D; display: flex; flex-direction: column; gap: 1px; text-shadow: none">
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.14em; color: #A7AD9F">ZOOM</span>
<span data-bind="cardZoom" style="font-family: 'Share Tech Mono', monospace; font-size: 20px; color: #F2B33D">12×</span>
<span style="font-size: 12px; color: #C9CDC2">swipe sideways</span>
</div>

<div style="position: absolute; left: 24px; bottom: 16px; max-width: 320px">
<div data-bind="hintBox" style="padding: 7px 14px; border-radius: 16px; background: rgba(10,12,11,0.55); font-size: 13px; text-shadow: none"><span data-bind="hint">Stick to move, drag to look</span></div>
</div>

<div data-bind="stick" style="position: absolute; left: 44px; top: 190px; width: 132px; height: 132px; border-radius: 66px; border: 2px solid rgba(237,239,232,0.32); background: rgba(10,12,11,0.32); display: flex; align-items: center; justify-content: center">
<div data-bind="stickKnob" style="width: 56px; height: 56px; border-radius: 28px; border: 2px solid rgba(237,239,232,0.75); background: rgba(237,239,232,0.42)"></div>
</div>

<div data-bind="stances" style="position: absolute; right: 24px; top: 92px; display: flex; flex-direction: column; align-items: center; gap: 8px">
<button data-on="stand" data-bind="standBtn" aria-label="Stand" style="width: 88px; height: 36px; border-radius: 18px; border: 1px solid rgba(237,239,232,0.35); background: rgba(10,12,11,0.55); font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.14em; color: #EDEFE8">STAND</button>
<button data-on="crouch" data-bind="crouchBtn" aria-label="Crouch" style="width: 88px; height: 36px; border-radius: 18px; border: 1px solid rgba(237,239,232,0.35); background: rgba(10,12,11,0.55); font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.14em; color: #EDEFE8">CROUCH</button>
<button data-on="prone" data-bind="proneBtn" aria-label="Prone" style="width: 88px; height: 36px; border-radius: 18px; border: 1px solid rgba(237,239,232,0.35); background: rgba(10,12,11,0.55); font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 14px; letter-spacing: 0.14em; color: #EDEFE8">PRONE</button>
</div>

<div style="position: absolute; right: 24px; bottom: 38px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<button data-on="scope" data-bind="scopeBtn" aria-label="Scope in" style="width: 88px; height: 88px; border-radius: 50%; border: 3px solid #F2B33D; background: rgba(10,12,11,0.62); display: grid; place-items: center"><svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#EDEFE8" stroke-width="2.4" aria-hidden="true"><circle cx="20" cy="20" r="15"></circle><path d="M20 3v34M3 20h34"></path></svg></button>
<span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.14em">SCOPE IN</span>
</div>
<div data-bind="pauseMenu" data-hidden style="position: absolute; left: 0; top: 0; right: 0; bottom: 0; background: rgba(8,10,9,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px">
<div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 0.16em">PAUSED</div>
<div data-bind="pauseNote" style="font-size: 12px; color: #A7AD9F">The clock is stopped. The bot waits for you.</div>
<button data-on="resume" style="width: 260px; height: 52px; border: none; background: #F2B33D; color: #14120c; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 0.14em">RESUME</button>
<button data-on="forfeit" data-bind="forfeit" style="width: 260px; height: 44px; border: 1px solid rgba(229,72,59,0.7); background: rgba(10,12,11,0.5); color: #ff8a7e; font-family: 'Barlow Condensed', sans-serif; font-weight: 700; font-size: 16px; letter-spacing: 0.14em">FORFEIT MATCH</button>
</div>
</div>
